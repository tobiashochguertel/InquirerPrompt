name: CD — Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

# Centralized version pins — adjust here to update all jobs
env:
  UV_VERSION: "0.5.18"
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Only run on non-fork repositories
    if: github.repository_owner == 'tobiashochguertel'
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check if release needed
        id: check
        run: |
          NEXT_TAG=$(uv run semantic-release version --print-tag 2>/dev/null || echo "")
          if [ -n "$NEXT_TAG" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run semantic-release
        if: steps.check.outputs.released == 'true'
        run: uv run semantic-release -vv version
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}

      - name: Publish to PyPI
        if: steps.check.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

      - name: Publish to GitHub Releases
        if: steps.check.outputs.released == 'true'
        run: |
          TAG="${{ steps.check.outputs.tag }}"
          gh release create "$TAG" --generate-notes --title "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
