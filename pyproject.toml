[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "InquirerPrompt"
version = "0.3.4"
description = "Python port of Inquirer.js — a collection of common interactive command-line user interfaces (community-maintained fork of InquirerPy)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Kevin Zhuang", email = "kevin7441@gmail.com" },
]
maintainers = [
  { name = "Tobias Hochgürtel", email = "tobiashochguertel@users.noreply.github.com" },
]
keywords = ["cli", "prompt-toolkit", "commandline", "inquirer", "development", "interactive", "prompt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Unix",
  "Operating System :: Microsoft",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pfzy>=0.3.1",
  "prompt-toolkit>=3.0.1",
]

[project.optional-dependencies]
docs = [
  "sphinx>=4.1.2",
  "furo",
  "myst-parser",
  "sphinx-autobuild",
  "sphinx-copybutton",
]

[project.urls]
repository = "https://github.com/tobiashochguertel/InquirerPrompt"
documentation = "https://InquirerPrompt.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["InquirerPy"]

[tool.hatch.build.targets.wheel.force-include]
"InquirerPy/py.typed" = "InquirerPy/py.typed"

[dependency-groups]
dev = [
  "coverage[toml]>=7.0",
  "griffe>=1.0",
  "pre-commit>=3.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "python-semantic-release>=9.0",
  "pyyaml>=6.0.1",
  "ruff>=0.8",
]

[tool.coverage.run]
source = ["InquirerPy"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, D = pydocstyle (pep257),
# UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "D", "UP", "B"]
ignore = [
  "D107",   # missing docstring in __init__
  "D100",   # missing docstring in public module (pre-existing)
  "D101",   # missing docstring in public class (pre-existing)
  "D102",   # missing docstring in public method (pre-existing)
  "D103",   # missing docstring in public function (pre-existing)
  "D104",   # missing docstring in public package (pre-existing)
  "D105",   # missing docstring in magic method (pre-existing)
  "D107",   # missing docstring in __init__ (pre-existing)
  "E501",   # line too long (pre-existing, formatter handles most)
  "UP006",  # non-pep585-annotation (pre-existing, would break 3.9)
  "UP035",  # deprecated-import (pre-existing, would break 3.9)
  "UP031",  # printf-string-formatting (pre-existing)
  "E731",   # lambda-assignment (pre-existing, cosmetic)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "F403",   # undefined-local-with-import-star (test files use star imports)
  "F405",   # undefined-local-with-import-star-usage
  "E722",   # bare-except (test code)
  "E712",   # true-false-comparison (test code)
  "E711",   # none-comparison (test code)
  "B904",   # raise-without-from (test code)
  "B018",   # useless-expression (test code)
  "UP028",  # yield-in-for-loop (test code)
]

[tool.ruff.lint.isort]
known-first-party = ["InquirerPy"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
# Black-compatible formatting
docstring-code-format = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = true
