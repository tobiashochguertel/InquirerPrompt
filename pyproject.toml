[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "InquirerPrompt"
version = "0.3.4"
description = "Python port of Inquirer.js — a collection of common interactive command-line user interfaces (community-maintained fork of InquirerPy)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Kevin Zhuang", email = "kevin7441@gmail.com" },
]
maintainers = [
  { name = "Tobias Hochgürtel", email = "tobiashochguertel@users.noreply.github.com" },
]
keywords = ["cli", "prompt-toolkit", "commandline", "inquirer", "development", "interactive", "prompt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Unix",
  "Operating System :: Microsoft",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pfzy>=0.3.1",
  "prompt-toolkit>=3.0.1",
]

[project.optional-dependencies]
docs = [
  "sphinx>=4.1.2",
  "furo",
  "myst-parser",
  "sphinx-autobuild",
  "sphinx-copybutton",
]

[project.urls]
repository = "https://github.com/tobiashochguertel/InquirerPrompt"
documentation = "https://InquirerPrompt.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["InquirerPy"]

[tool.hatch.build.targets.wheel.force-include]
"InquirerPy/py.typed" = "InquirerPy/py.typed"

[dependency-groups]
dev = [
  "black>=24.0",
  "coverage[toml]>=7.0",
  "griffe>=1.0",
  "isort>=5.13",
  "pre-commit>=3.0",
  "pydocstyle>=6.3",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "python-semantic-release>=9.0",
  "pyyaml>=6.0.1",
]

[tool.coverage.run]
source = ["InquirerPy"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = ["if TYPE_CHECKING:"]

[tool.isort]
profile = "black"

[tool.pydocstyle]
match = "^(?!(.*(init|main))).*\\.py"
convention = "pep257"
add-ignore = "D107"
match_dir = "^(?!(example)).*"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = true
